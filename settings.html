<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - TAGMEE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">TAGMEE ADMIN</div>
</header>

<section class="hero">
    <h1>Website Settings</h1>
    <p>Manage your platform settings.</p>
</section>

<section class="companies">

<div class="card">
<h2>Website Name</h2>
<input type="text" value="TAGMEE">
</div>

<div class="card">
<h2>Support Email</h2>
<input type="email" value="support@tagmee.com">
</div>

<div class="card">
<h2>Currency</h2>
<select>
<option>USD ($)</option>
<option>EUR (€)</option>
<option>GBP (£)</option>
<option>NGN (₦)</option>
</select>
</div>

<div class="card">
<h2>Maintenance Mode</h2>
<label>
<input type="checkbox">
 Enable Maintenance Mode
</label>
</div>

<div class="card">
<h2>Save Changes</h2>
<button>Save Settings</button>
</div>

</section>

<script src="script.js"></script>

</body>
</html>
