<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw - TAGMEE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">TAGMEE</div>
    <div>💸</div>
</header>

<section class="hero">
    <h1>Withdraw Funds</h1>
    <p>Request a withdrawal from your account.</p>
</section>

<section class="companies">

<div class="card">
    <h2>Available Balance</h2>
    <h1>$24,560.75</h1>
</div>

<div class="card">
    <h2>Withdrawal Amount</h2>
    <input type="number" placeholder="Enter amount">
</div>

<div class="card">
    <h2>Select Withdrawal Method</h2>

    <select>
        <option>Bank Transfer</option>
        <option>Mobile Money</option>
    </select>
</div>

<div class="card">
    <h2>Account Details</h2>

    <input type="text" placeholder="Account Name">
    <input type="text" placeholder="Bank Name">
    <input type="text" placeholder="Account Number">
</div>

<div class="card">
    <button style="width:100%;padding:15px;background:#8b5cf6;color:white;border:none;border-radius:10px;font-size:18px;">
        Request Withdrawal
    </button>
</div>

<div class="card">
    <h2>Withdrawal History</h2>

    <p>No withdrawals yet.</p>
</div>

</section>

<footer>
<nav style="display:flex;justify-content:space-around;padding:15px;">
