<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAGMEE Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">TAGMEE ADMIN</div>
</header>

<section class="hero">
    <h1>Administrator Dashboard</h1>
    <p>Manage your brokerage platform.</p>
</section>

<section class="companies">

<div class="card">
    <h2>👥 Users</h2>
    <p>Total Users: 0</p>
    <a href="users.html"><button>View Users</button></a>
</div>

<div class="card">
    <h2>💰 Deposits</h2>
    <p>Pending Deposits: 0</p>
    <a href="deposits.html">
    <button>Review Deposits</button>
    </a>
</div>

<div class="card">
    <h2>💸 Withdrawals</h2>
    <p>Pending Withdrawals: 0</p>
    <a href="withdrawals.html">
    <button>Review Withdrawals</button>
    </a>
</div>

<div class="card">
    <h2>📈 Companies</h2>
    <p>Manage companies and share prices.</p>
    <a href="companies.html">
    <button>Manage Companies</button>
    </a>
</div>

<div class="card">
    <h2>📋 Orders</h2>
    <p>View all share orders.</p>
    <button>View Orders</button>
</div>

<div class="card">
    <h2>📢 Announcements</h2>
    <p>Send announcements to users.</p>
    <button>Create Announcement</button>
</div>

</section>

<script src="script.js"></script>

</body>
</html>
